# ─────────────────────────────────────────────────────────────
#  Design gallery. One entry per artwork; order on the page comes from rank.
#
#  To add a piece:
#   1. Upload the image to  assets/images/artwork/
#   2. Copy one block below and change the values.
#
#  file:      the image file name (exactly as uploaded)
#  title:     shown in the full-size viewer and read by screen readers
#  year:      when you made it
#  medium:    optional, e.g. "Illustrator", "Gouache on paper"
#  category:  used for the filter buttons (e.g. Poster, Illustration, Branding)
#  rank:      1-5. Higher ranks sit higher in the gallery.
#             All 4s and 5s appear in the home page window (5s first); 1-3 never do.
#             Posters shuffle within the same rank on every visit. Missing = 3.
#  highlight: true = show the red "Highlight" badge on it
# ─────────────────────────────────────────────────────────────

