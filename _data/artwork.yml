# ─────────────────────────────────────────────────────────────
#  Design gallery. One entry per artwork, shown in this order.
#
#  To add a piece:
#   1. Upload the image to  assets/images/artwork/
#   2. Copy one block below and change the values.
#
#  file:      the image file name (exactly as uploaded)
#  title:     shown under the image
#  year:      when you made it
#  medium:    optional, e.g. "Illustrator", "Gouache on paper"
#  category:  used for the filter buttons (e.g. Poster, Illustration, Branding)
#  featured:  true = also show it on the home page (up to 6)
# ─────────────────────────────────────────────────────────────

