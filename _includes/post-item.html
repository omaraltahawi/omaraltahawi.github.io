{% assign post = include.post %}
<li class="post-item reveal">
  <a href="{{ post.url | relative_url }}">
    <time class="mono-meta" datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: "%b %d, %Y" }}</time>
    <span class="post-item-title">{{ post.title }}</span>
    {% if post.description %}<span class="post-item-desc muted">{{ post.description }}</span>{% endif %}
    <span class="post-item-arrow" aria-hidden="true">→</span>
  </a>
</li>
