<dialog class="lightbox" aria-label="Artwork viewer">
  <figure class="lightbox-figure">
    <img class="lightbox-img" src="" alt="">
    <figcaption>
      <span class="lightbox-title"></span>
      <span class="lightbox-meta mono-meta"></span>
    </figcaption>
  </figure>
  <button class="lightbox-btn lightbox-close" type="button" aria-label="Close">✕</button>
  <button class="lightbox-btn lightbox-prev" type="button" aria-label="Previous artwork">←</button>
  <button class="lightbox-btn lightbox-next" type="button" aria-label="Next artwork">→</button>
</dialog>
