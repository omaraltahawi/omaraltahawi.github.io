<header class="site-header">
  <a class="wordmark" href="{{ '/' | relative_url }}" aria-label="{{ site.title }}, home">
    O.A.
  </a>

  <nav aria-label="Main">
    <ul class="nav-links" id="nav-links">
      {% for item in site.nav %}
        {% assign active = false %}
        {% if page.url contains item.url %}{% assign active = true %}{% endif %}
        <li><a href="{{ item.url | relative_url }}"{% if active %} aria-current="page"{% endif %}>{{ item.title }}</a></li>
      {% endfor %}
    </ul>
  </nav>

  <div class="header-actions">
    <button class="theme-toggle" type="button" aria-label="Switch colour theme" title="Switch colour theme">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg>
    </button>
    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="nav-links">
      <span class="nav-toggle-label">Menu</span>
      <span class="nav-toggle-bars" aria-hidden="true"></span>
    </button>
  </div>
</header>
